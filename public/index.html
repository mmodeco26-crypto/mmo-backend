<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة إدارة منصة موتو دليفري — الجزائر DZ | Moto Delivery & Dispatch Platform</title>

  <!-- Google Fonts: Cairo for Arabic & JetBrains Mono for DZD Numerics -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN with Dark Theme Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#172033',
              900: '#0f172a',
              950: '#070d1a',
            },
            amber: {
              450: '#fbbf24',
              550: '#d97706',
            }
          },
          fontFamily: {
            sans: ['Cairo', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          boxShadow: {
            'glow-amber': '0 0 25px -5px rgba(245, 158, 11, 0.35)',
            'glow-emerald': '0 0 25px -5px rgba(16, 185, 129, 0.35)',
            'glow-sky': '0 0 25px -5px rgba(14, 165, 233, 0.35)',
          }
        }
      }
    };
  </script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Canvas Confetti for delivery celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Radar Pulse Animation */
    @keyframes radarPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      70% {
        box-shadow: 0 0 0 16px rgba(16, 185, 129, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }
    .radar-pulse {
      animation: radarPulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    /* Glassmorphism Classes */
    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.65);
    }
    .glass-card-subtle {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(71, 85, 105, 0.4);
    }

    /* Leaflet Dark Theme Overrides */
    .leaflet-popup-content-wrapper {
      background: #0f172a !important;
      color: #f1f5f9 !important;
      border: 1px solid #334155 !important;
      border-radius: 1rem !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5) !important;
      padding: 0 !important;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      line-height: 1.4 !important;
    }
    .leaflet-popup-tip {
      background: #0f172a !important;
      border: 1px solid #334155 !important;
    }
    .leaflet-container {
      background-color: #070d1a !important;
      font-family: 'Cairo', sans-serif !important;
    }

    /* Route Polyline Glow */
    .leaflet-interactive.route-glow {
      filter: drop-shadow(0 0 6px #0284c7);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased font-sans selection:bg-amber-500 selection:text-slate-950 overflow-x-hidden min-h-screen">
  <div id="root">
    <!-- Initial Loading State while React mounts -->
    <div class="min-h-screen flex flex-col items-center justify-center p-4">
      <div class="w-16 h-16 rounded-2xl bg-amber-500/20 text-amber-400 border border-amber-500/40 flex items-center justify-center text-3xl mb-4 animate-bounce">
        🛵
      </div>
      <h2 class="text-base font-extrabold text-slate-100 mb-1">منصة موتو دليفري الجزائر DZ</h2>
      <p class="text-xs text-slate-400">جاري تشغيل لوحة التحكم ومحاكي التوصيل...</p>
    </div>
  </div>

  <!-- Compiled High-Performance React Application -->
  <script src="app.js"></script>
</body>
</html>
