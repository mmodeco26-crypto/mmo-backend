    // Haversine distance calculator
    function getDistanceKm(c1: [number, number], c2: [number, number]): number {
      const R = 6371;
      const dLat = (c2[0] - c1[0]) * Math.PI / 180;
      const dLon = (c2[1] - c1[1]) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(c1[0] * Math.PI / 180) * Math.cos(c2[0] * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Number((R * c).toFixed(2));
    }

    // Interpolate points for smooth curve path along Algiers bay
    function interpolatePath(p1: [number, number], p2: [number, number], steps = 50): [number, number][] {
      const points: [number, number][] = [];
      const midLat = (p1[0] + p2[0]) / 2 + 0.005; // natural highway curve towards coast
      const midLng = (p1[1] + p2[1]) / 2 - 0.003;

      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        // Quadratic bezier
        const lat = (1 - t) * (1 - t) * p1[0] + 2 * (1 - t) * t * midLat + t * t * p2[0];
        const lng = (1 - t) * (1 - t) * p1[1] + 2 * (1 - t) * t * midLng + t * t * p2[1];
        points.push([lat, lng]);
      }
      return points;
    }

    // =========================================================================
    // 🔊 WEB AUDIO API CHIME GENERATOR
    // =========================================================================
    function playAudioTone(type: 'order' | 'delivered' | 'action', soundEnabled = true) {
      if (!soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || (window as any).webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        if (type === 'order') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now); // D5
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.2); // A5
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
        } else if (type === 'delivered') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.18, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.35);
          });
        }
      } catch (e) {}
    }

      const kpis = useMemo(() => {
        const deliveredOrders = orders.filter((o: any) => o.status === 'delivered');
        const gmv = deliveredOrders.reduce((acc: number, o: any) => acc + (Number(o.total_price) || 0), 0);
        const commission = gmv * (settings.commission_rate / 100);
        const onlineDriversCount = drivers.filter((d: any) => d.is_online).length;
        const pendingKycCount = kycRequests.filter((k: any) => k.status === 'pending').length;

        return {
          gmv: gmv + 284500, // include cumulative GMV
          deliveredCount: deliveredOrders.length + 138,
          commission: commission + 42675,
          totalDrivers: drivers.length,
          onlineDrivers: onlineDriversCount,
          totalClients: clients.length + 59,
          pendingKyc: pendingKycCount,
          totalAgents: agents.length
        };
      }, [orders, drivers, clients, kycRequests, agents, settings]);

      const orderStats = useMemo(() => {
        const map: Record<string, number> = { delivered: 0, pending: 0, in_transit: 0, accepted: 0, picked_up: 0, cancelled: 0 };
        orders.forEach((o: any) => {
          if (map[o.status] !== undefined) map[o.status]++;
          else map[o.status] = 1;
        });
        const total = orders.length;
        return {
          total,
          delivered: map.delivered || 0,
          pending: map.pending || 0,
          inTransit: (map.in_transit || 0) + (map.accepted || 0) + (map.picked_up || 0),
          cancelled: map.cancelled || 0,
        };
      }, [orders]);

      // Current Selected Simulator Driver
      const currentSimDriver = useMemo(() => {
        return drivers.find((d: any) => d.id === simDriverId) || drivers[0];
      }, [drivers, simDriverId]);

      // Simulator dynamic path
      const simPathPoints = useMemo(() => {
        return interpolatePath(simPickup.coords, simDropoff.coords, 60);
      }, [simPickup, simDropoff]);

      // Current moving motorcycle coordinate based on simProgress (0 to 100)
      const currentSimBikeCoord = useMemo<[number, number]>(() => {
        if (!simPathPoints.length) return simPickup.coords;
        const index = Math.min(
          simPathPoints.length - 1,
          Math.max(0, Math.floor((simProgress / 100) * (simPathPoints.length - 1)))
        );
        return simPathPoints[index];
      }, [simPathPoints, simProgress]);

      // Dynamic price calculation in simulator
      const simDistanceKm = useMemo(() => {
        return getDistanceKm(simPickup.coords, simDropoff.coords);
      }, [simPickup, simDropoff]);

      const simCalculatedPrice = useMemo(() => {
        const base = settings.base_fee;
        const distanceFare = simDistanceKm * settings.per_km_rate;
        return Number((base + distanceFare).toFixed(2));
      }, [simDistanceKm, settings]);

      // ⚡ 1-Click Complete Scenario Runner (Automated Interactive Simulation)
      const runOneClickScenario = () => {
        if (isAutoSimulating) return;
        setIsAutoSimulating(true);
        playAudioTone('order', soundEnabled);

        const newOrderId = Math.random().toString(16).slice(2, 10);
        const nowTime = new Date().toLocaleTimeString('ar-DZ', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        // Step 1: Client Places Order
        setSimActiveOrder({
          id: newOrderId,
          status: 'pending',
          pickup_address: simPickup.name,
          dropoff_address: simDropoff.name,
          price: simCalculatedPrice,
          distance_km: simDistanceKm
        });

        setSimClientLogs(prev => [
          { time: nowTime, text: `⚡ تشغيل السيناريو الكامل 1-Clic: إنشاء طلب جديد #${newOrderId}`, type: 'warning' },

        setTimeout(() => {
          setSimActiveOrder((curr: any) => ({ ...curr, status: 'accepted' }));
          setSimProgress(15);
          playAudioTone('action', soundEnabled);
          setSimDriverLogs(prev => [

        setTimeout(() => {

          setSimProgress(35);
          playAudioTone('action', soundEnabled);
          setSimClientLogs(prev => [

        // Step 4: Progress Animation (35% -> 85%) after 4.8s
        setTimeout(() => {
          setSimActiveOrder((curr: any) => ({ ...curr, status: 'in_transit' }));
          setSimProgress(85);
        }, 4800);

        // Step 5: Arrived & Cash Delivered after 6.5s
        setTimeout(() => {
          setSimActiveOrder((curr: any) => ({ ...curr, status: 'delivered' }));
          setSimProgress(100);
          playAudioTone('delivered', soundEnabled);

          // Credit driver wallet
          const driverShare = simCalculatedPrice * 0.85;
          setDrivers((curr: any) => curr.map((d: any) => d.id === currentSimDriver.id ? { ...d, wallet_balance: d.wallet_balance + driverShare, total_deliveries: d.total_deliveries + 1 } : d));

          // Add to orders
          setOrders((curr: any) => [
            {
              id: newOrderId,
              client_name: 'زبون محاكي (Direct)',
              client_phone: '0550000000',
              driver_name: currentSimDriver.name,
              driver_phone: currentSimDriver.phone,
              pickup_address: simPickup.name,
              dropoff_address: simDropoff.name,
              pickup_lat: simPickup.coords[0],
              pickup_lng: simPickup.coords[1],
              dropoff_lat: simDropoff.coords[0],
              dropoff_lng: simDropoff.coords[1],
              distance_km: simDistanceKm,
              total_price: simCalculatedPrice,
              discount_amount: 0,
              status: 'delivered',
              created_at: new Date().toISOString().slice(0, 16).replace('T', ' ')

            ...curr

          setSimClientLogs(prev => [
            { time: new Date().toLocaleTimeString('ar-DZ'), text: `🎉 تم تسليم الطرد بنجاح ودفع ${simCalculatedPrice.toLocaleString()} DZD كاش! شكراً لاختياركم موتو دليفري`, type: 'success' },

      // Handle order manual status transition
      const handleStepOrderStatus = (orderId: string) => {
        setOrders((curr: any) => curr.map((o: any) => {
          if (o.id !== orderId) return o;
          const statusOrder = ['pending', 'accepted', 'picked_up', 'in_transit', 'delivered'];
          const currIdx = statusOrder.indexOf(o.status);
          if (currIdx >= 0 && currIdx < statusOrder.length - 1) {
            const nextStatus = statusOrder[currIdx + 1];
            playAudioTone(nextStatus === 'delivered' ? 'delivered' : 'action', soundEnabled);

        setOrders((curr: any) => curr.map((o: any) => o.id === modalEditPrice.orderId ? { ...o, total_price: newPrice } : o));
        setModalEditPrice({ open: false, orderId: '', currentPrice: 0 });
      };

      // Save promo on order
      const handleApplyPromo = (code: string, directAmount: number) => {
        setOrders((curr: any) => curr.map((o: any) => {
          if (o.id !== modalApplyPromo.orderId) return o;
          let discount = 0;
          let promoCodeApplied = code.toUpperCase();
          if (promoCodeApplied) {
            const promo = promos.find((p: any) => p.code === promoCodeApplied && p.is_active);
            if (promo) {
              discount = promo.discount_type === 'percentage'
                ? Math.min((o.total_price * promo.discount_value) / 100, promo.max_discount || 9999)

            } else {
              discount = 100;
            }
          } else if (directAmount > 0) {
            discount = directAmount;
            promoCodeApplied = 'REDUCTION';
          }
          const newPrice = Math.max(0, o.total_price - discount);
          return { ...o, total_price: newPrice, discount_amount: (o.discount_amount || 0) + discount, promo_code: promoCodeApplied };

            o.client_name.toLowerCase().includes(q) ||

            o.pickup_address.toLowerCase().includes(q) ||
            o.dropoff_address.toLowerCase().includes(q) ||

            <div className="lg:col-span-6 glass-card rounded-3xl p-4 border border-slate-800 flex flex-col justify-between space-y-3">
              <div className="flex items-center justify-between pb-2 border-b border-slate-800 text-xs">
                <div className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 radar-pulse"></span>
                  <span className="font-bold text-slate-100">مسار التوصيل المباشر — شبكة طرق العاصمة DZ</span>
                </div>

                <div className="flex items-center gap-1">
                  <button
                    onClick={() => setMapTheme('dark')}
                    className={`px-2 py-0.5 rounded-lg text-[10px] font-bold ${mapTheme === 'dark' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}
                  >
                    ليلي 🌙
                  </button>
                  <button
                    onClick={() => setMapTheme('sat')}
                    className={`px-2 py-0.5 rounded-lg text-[10px] font-bold ${mapTheme === 'sat' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}
                  >
                    قمر 🛰️
                  </button>
                </div>
              </div>

              {/* Simulator Leaflet Map Canvas */}
              <div className="relative rounded-2xl overflow-hidden border border-slate-800 h-[480px] w-full bg-slate-950">
                <SimulatorLeafletMap
                  pickup={simPickup.coords}
                  dropoff={simDropoff.coords}
                  pathPoints={simPathPoints}
                  bikeCoord={currentSimBikeCoord}
                  driverName={currentSimDriver.name}
                  progress={simProgress}
                  theme={mapTheme}
                />
              </div>

              {/* Map Footer & Legend */}
              <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-800 text-xs font-mono">
                <div className="flex items-center gap-3 text-slate-400 text-[11px]">
                  <span>🟢 استلام: {simPickup.shortName}</span>
                  <span>🔴 تسليم: {simDropoff.shortName}</span>
                  <span className="text-amber-400 font-bold">🛵 السائق: {currentSimDriver.name}</span>
                </div>
                <div className="text-slate-500 text-[10px]">
                  تقدم المسار: <strong className="text-emerald-400">{simProgress}%</strong>
                </div>
              </div>
            </div>

            {/* --------------------------------------------------------------------- */}
            {/* COLUMN 3 (LEFT): 🛵 واجهة السائق (LIVREUR) */}
            {/* --------------------------------------------------------------------- */}
            <div className="lg:col-span-3 glass-card rounded-3xl p-4 border border-slate-800 space-y-4">
              <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold">
                    🛵
                  </div>
                  <div>
                    <h3 className="font-extrabold text-sm text-slate-100">واجهة السائق</h3>
                    <span className="text-[10px] text-amber-400 font-bold">تطبيق Livreur DZ</span>
                  </div>
                </div>
                <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
              </div>

              {/* Driver Selector */}
              <div>
                <label className="block text-xs font-bold text-slate-300 mb-1">اختر السائق للتجربة:</label>
                <select
                  value={simDriverId}
                  onChange={(e) => setSimDriverId(e.target.value)}
                  className="w-full bg-slate-850 border border-slate-700 rounded-xl px-3 py-2 text-xs font-mono font-bold text-amber-400 focus:outline-none focus:border-amber-400"
                >
                  {drivers.map((d: any) => (
                    <option key={d.id} value={d.id}>{d.name} ({d.vehicle_plate})</option>
                  ))}
                </select>
              </div>

              {/* Driver Info Card */}
              <div className="p-3.5 rounded-2xl bg-gradient-to-br from-slate-900 to-slate-850 border border-slate-700/80 space-y-2">
                <div className="flex items-center justify-between">
                  <span className="font-extrabold text-slate-100 text-sm">{currentSimDriver.name}</span>
                  <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30">
                    {currentSimDriver.vehicle_plate}
                  </span>
                </div>
                <div className="text-xs text-slate-400 flex items-center justify-between">
                  <span>المركبة:</span>
                  <span className="text-slate-200 font-semibold">{currentSimDriver.vehicle_model}</span>
                </div>
                <div className="text-xs text-slate-400 flex items-center justify-between">
                  <span>الهاتف:</span>
                  <span className="font-mono text-slate-200">{currentSimDriver.phone}</span>
                </div>
                <div className="text-xs flex items-center justify-between pt-2 border-t border-slate-800">
                  <span className="text-slate-400">رصيد المحفظة الفعلي:</span>
                  <span className="font-mono font-black text-emerald-400 text-sm">{currentSimDriver.wallet_balance.toFixed(2)} DZD</span>
                </div>
              </div>

              {/* Online Presence Toggle */}
              <div className="flex items-center justify-between p-3 rounded-2xl bg-slate-900 border border-slate-800">
                <span className="text-xs font-bold text-slate-200">حالة التواجد (En ligne):</span>
                <span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                  متصل ومتاح 🟢
                </span>
              </div>

              {/* Driver Dynamic Progress Slider */}
              <div className="space-y-1.5 p-3 rounded-2xl bg-slate-900 border border-slate-800">
                <div className="flex justify-between items-center text-xs">
                  <span className="font-bold text-slate-300">مؤشر حركة السائق بالخريطة:</span>
                  <span className="font-mono font-black text-amber-400">{simProgress}%</span>
                </div>
                <input
                  type="range"
                  min="0"
                  max="100"
                  value={simProgress}
                  onChange={(e) => setSimProgress(parseInt(e.target.value))}
                  className="w-full accent-amber-500 cursor-pointer h-2 bg-slate-800 rounded-lg"
                />
                <div className="flex justify-between text-[10px] text-slate-500 font-mono">
                  <span>نقطة الاستلام (0%)</span>
                  <span>الوصول للوجهة (100%)</span>
                </div>
              </div>

              {/* Driver Action Buttons */}
              <div className="grid grid-cols-2 gap-2">
                <button
                  onClick={onPickupParcel}
                  className="py-2.5 px-3 rounded-xl bg-sky-500/20 hover:bg-sky-500/30 border border-sky-500/40 text-sky-300 font-bold text-xs transition"
                >
                  📦 استلمت الطرد
                </button>
                <button
                  onClick={onDeliverCash}
                  className="py-2.5 px-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs transition shadow-lg shadow-emerald-500/20"
                >
                  ✅ تم التسليم كاش
                </button>
              </div>

              {/* Driver Event Log */}
              <div className="pt-2 border-t border-slate-800">
                <span className="text-[11px] font-bold text-slate-400 block mb-2">📜 سجل أحداث السائق:</span>
                <div className="max-h-36 overflow-y-auto space-y-1.5 text-[10px] font-mono">
                  {simDriverLogs.map((log, idx) => (
                    <div key={idx} className="p-1.5 rounded-lg bg-slate-900 border border-slate-800 text-slate-300">
                      <span className="text-amber-400 ml-1">[{log.time}]</span> {log.text}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </main>
      );
    }

    // =========================================================================
    // 🗺️ LEAFLET MAP IMPLEMENTATIONS
    // =========================================================================
    // Map 1: Executive Dashboard Fleet Radar
    function FleetRadarLeaflet({ drivers, theme }: { drivers: any[]; theme: string }) {
      const mapRef = useRef<HTMLDivElement>(null);
      const leafletMap = useRef<any>(null);
      const markersRef = useRef<any[]>([]);

      useEffect(() => {
        if (!mapRef.current) return;
        if (!leafletMap.current) {
          leafletMap.current = L.map(mapRef.current, {
            center: [36.7538, 3.0588], // Alger Centre
            zoom: 12,
            zoomControl: false,
            attributionControl: false
          });
          L.control.zoom({ position: 'bottomright' }).addTo(leafletMap.current);
        }

        // Tile layer selector
        let tileUrl = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}';
        if (theme === 'sat') {
          tileUrl = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
        } else if (theme === 'light') {
          tileUrl = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
        }

        // Clear existing tile layers
        leafletMap.current.eachLayer((layer: any) => {
          if (layer instanceof L.TileLayer) {
            leafletMap.current.removeLayer(layer);
          }
        });
        L.tileLayer(tileUrl, { maxZoom: 18 }).addTo(leafletMap.current);

        // Update driver markers
        markersRef.current.forEach(m => leafletMap.current.removeLayer(m));
        markersRef.current = [];

        drivers.forEach((d: any) => {
          const isOnline = d.is_online;
          const iconHtml = `
            <div class="relative flex flex-col items-center">
              <div class="w-8 h-8 rounded-full ${isOnline ? 'bg-emerald-500 shadow-lg shadow-emerald-500/50 radar-pulse' : 'bg-slate-700'} border-2 border-white flex items-center justify-center text-xs text-white font-bold">
                🛵
              </div>
              <div class="mt-0.5 px-1.5 py-0.5 rounded bg-slate-900/90 border border-slate-700 text-[10px] font-bold text-slate-200 whitespace-nowrap">
                ${d.name} ${isOnline ? '🟢' : ''}
              </div>
            </div>
          `;
          const icon = L.divIcon({
            html: iconHtml,
            className: 'custom-fleet-icon',
            iconSize: [40, 48],
            iconAnchor: [20, 24]
          });
          const marker = L.marker([d.lat, d.lng], { icon }).addTo(leafletMap.current);
          marker.bindPopup(`
            <div class="p-3 text-right font-sans text-xs space-y-1.5" style="min-width: 190px;">
              <div class="font-bold text-slate-100 text-sm">${d.name} (${d.vehicle_model})</div>
              <div class="text-slate-400 font-mono text-[11px]">${d.vehicle_plate}</div>
              <div class="text-emerald-400 font-mono font-bold">الرصيد: ${d.wallet_balance.toFixed(2)} DZD</div>
              <div class="pt-1.5 border-t border-slate-800">
                <a href="tel:${d.phone}" class="block text-center py-1 bg-amber-500 text-slate-950 font-bold rounded-lg text-xs">
                  📞 اتصال مباشر
                </a>
              </div>
            </div>
          `);
          markersRef.current.push(marker);
        });

        return () => {
          // keep map instance alive
        };
      }, [drivers, theme]);

      return <div ref={mapRef} className="w-full h-full" />;
    }

    // Map 2: Simulator 3-Column Interactive Map
    function SimulatorLeafletMap({
      pickup,
      dropoff,
      pathPoints,
      bikeCoord,
      driverName,
      progress,
      theme
    }: any) {
      const mapRef = useRef<HTMLDivElement>(null);
      const leafletMap = useRef<any>(null);
      const polylineRef = useRef<any>(null);
      const pickupMarkerRef = useRef<any>(null);
      const dropoffMarkerRef = useRef<any>(null);
      const bikeMarkerRef = useRef<any>(null);

      useEffect(() => {
        if (!mapRef.current) return;
        if (!leafletMap.current) {
          leafletMap.current = L.map(mapRef.current, {
            center: [36.7538, 3.0588],
            zoom: 12,
            zoomControl: false,
            attributionControl: false
          });
          L.control.zoom({ position: 'bottomright' }).addTo(leafletMap.current);
        }

        // Tile layer
        let tileUrl = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}';
        if (theme === 'sat') {
          tileUrl = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
        }
        leafletMap.current.eachLayer((layer: any) => {
          if (layer instanceof L.TileLayer) {
            leafletMap.current.removeLayer(layer);
          }
        });
        L.tileLayer(tileUrl, { maxZoom: 18 }).addTo(leafletMap.current);

        // Draw / Update Polyline
        if (polylineRef.current) leafletMap.current.removeLayer(polylineRef.current);
        polylineRef.current = L.polyline(pathPoints, {
          color: '#0284c7',
          weight: 5,
          opacity: 0.85,
          dashArray: '8, 8',
          className: 'route-glow'
        }).addTo(leafletMap.current);

        // Pickup Marker (Green)
        if (pickupMarkerRef.current) leafletMap.current.removeLayer(pickupMarkerRef.current);
        const pickupIcon = L.divIcon({
          html: '<div class="w-7 h-7 rounded-full bg-emerald-500 border-2 border-white flex items-center justify-center text-xs shadow-lg radar-pulse">🟢</div>',
          className: 'custom-pin',
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });
        pickupMarkerRef.current = L.marker(pickup, { icon: pickupIcon }).addTo(leafletMap.current);
        pickupMarkerRef.current.bindPopup('<div class="p-2 text-xs font-bold text-right text-emerald-400">نقطة الاستلام (Pickup)</div>');

        // Dropoff Marker (Red)
        if (dropoffMarkerRef.current) leafletMap.current.removeLayer(dropoffMarkerRef.current);
        const dropoffIcon = L.divIcon({
          html: '<div class="w-7 h-7 rounded-full bg-rose-500 border-2 border-white flex items-center justify-center text-xs shadow-lg">🔴</div>',
          className: 'custom-pin',
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });
        dropoffMarkerRef.current = L.marker(dropoff, { icon: dropoffIcon }).addTo(leafletMap.current);
        dropoffMarkerRef.current.bindPopup('<div class="p-2 text-xs font-bold text-right text-rose-400">وجهة التسليم (Dropoff)</div>');

        // Fit map bounds to encompass the journey
        const bounds = L.latLngBounds([pickup, dropoff]);
        leafletMap.current.fitBounds(bounds, { padding: [50, 50] });
      }, [pickup, dropoff, pathPoints, theme]);

      // Moving Motorcycle Marker along path
      useEffect(() => {
        if (!leafletMap.current || !bikeCoord) return;
        if (bikeMarkerRef.current) leafletMap.current.removeLayer(bikeMarkerRef.current);

        const bikeIcon = L.divIcon({
          html: `
            <div class="relative flex flex-col items-center">
              <div class="w-9 h-9 rounded-full bg-amber-500 text-slate-950 border-2 border-white shadow-xl flex items-center justify-center text-sm font-black transition-transform duration-200">
                🛵
              </div>
              <div class="mt-1 px-2 py-0.5 rounded-md bg-slate-900 border border-amber-500/40 text-[10px] font-bold text-amber-300 whitespace-nowrap shadow-md">
                السائق: ${driverName} (${progress}%)
              </div>
            </div>
          `,
          className: 'custom-bike-marker',
          iconSize: [42, 54],
          iconAnchor: [21, 27]
        });

        bikeMarkerRef.current = L.marker(bikeCoord, { icon: bikeIcon }).addTo(leafletMap.current);
      }, [bikeCoord, driverName, progress]);

      return <div ref={mapRef} className="w-full h-full" />;
    }

    // =========================================================================
    // 🚀 MOUNT REACT ROOT
    // =========================================================================
    const rootElement = document.getElementById('root');
    if (rootElement) {
      ReactDOM.createRoot(rootElement).render(<App />);
    }
  </script>
</body>
