version: '3.8'
services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: moto_delivery_db
    environment:
      POSTGRES_DB: moto_delivery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moto_delivery"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: moto_delivery_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
